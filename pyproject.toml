[project]
name = "vgsr"
version = "0.1.0"
description = "Verifier-Guided Structured Reasoning for Cross-Database Query Generation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    # Core numerical / ML
    "numpy>=2.0",
    "pandas>=2.2",

    # Hugging Face ecosystem
    "transformers>=4.50",
    "datasets>=3.0",
    "tokenizers>=0.21",
    "accelerate>=1.0",
    "peft>=0.14",
    "trl>=0.15",

    # Training / optimization
    "safetensors>=0.4",

    # Configuration
    "pyyaml>=6.0",
    "pydantic>=2.0",

    # Database / query processing
    "sqlglot>=26.0",
    "sqlparse>=0.5",

    # Graph / structured reasoning
    "networkx>=3.0",

    # Evaluation
    "scikit-learn>=1.5",

    # Experiment tracking / reproducibility
    "tqdm>=4.66",

    # Utilities
    "rich>=13.0",
]

[project.optional-dependencies]

# Development tools
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
]

# NVIDIA / CUDA training environment
gpu = [
    "bitsandbytes>=0.45",
]

# Experiment tracking
experiment = [
    "wandb>=0.19",
]

[project.scripts]
vgsr = "vgsr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vgsr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
